<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainy's Tools 💕 | VPM Repository</title>
    <meta name="description" content="A custom VRChat Creator Companion (VCC) repository hosting Rainy's optimization and outfit tools.">
    <meta name="google-site-verification" content="x9wSlCrrXfZPRBmylTZMBj1eefXqvXW0tgLQeOloKK0" />
    <meta name="keywords" content="VRChat, VCC, VPM, VRCFury, Outfit Linker, Unity tool, avatar customization, GitHub">
    <meta name="author" content="rainywithin">
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-top: #ffd6e7;
            --bg-bottom: #ffeef6;
            --card-bg: #fffcfd;
            --border-color: #7a465c;
            --text-main: #693b4e;
            --accent-pink: #ff6b9d;
            --accent-purple: #d896ff;
            --btn-blue: #bfe5ff;
            --btn-blue-hover: #a8d9fc;
            --shadow-color: #5c3042;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, var(--bg-top) 0%, #fff0f7 50%, #f4dcff 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(circle, rgba(255, 107, 157, 0.15) 2px, transparent 2.5px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-item {
            position: absolute;
            bottom: -50px;
            user-select: none;
            animation: floatUp 14s infinite linear;
        }

        .h1 { left: 6%; font-size: 2.2rem; animation-duration: 13s; animation-delay: 0s; color: var(--accent-pink); }
        .h2 { left: 16%; font-size: 1.5rem; animation-duration: 9s; animation-delay: 3s; color: var(--accent-purple); }
        .h3 { left: 26%; font-size: 1.8rem; animation-duration: 16s; animation-delay: 6s; color: var(--accent-pink); opacity: 0.5; }
        .h4 { left: 74%; font-size: 2.1rem; animation-duration: 11s; animation-delay: 1s; color: var(--accent-pink); }
        .h5 { left: 84%; font-size: 1.6rem; animation-duration: 15s; animation-delay: 4s; color: var(--accent-purple); }
        .h6 { left: 93%; font-size: 2.4rem; animation-duration: 18s; animation-delay: 2s; color: var(--accent-pink); opacity: 0.5; }
        .h7 { left: 45%; font-size: 1.3rem; animation-duration: 12s; animation-delay: 7s; color: var(--accent-pink); opacity: 0.4; }
        .h8 { left: 55%; font-size: 1.7rem; animation-duration: 10s; animation-delay: 5s; color: var(--accent-purple); }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.15); opacity: 0; }
        }

        .side-sticker {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .side-sticker img {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(6px 6px 0px var(--border-color));
            border-radius: 18px;
            border: 3.5px solid var(--border-color);
            background: #fff5fa;
            padding: 6px;
        }

        .sticker-left {
            left: max(3vw, 20px);
            bottom: 8%;
            width: clamp(140px, 18vw, 240px);
            animation: swayLeft 4.5s ease-in-out infinite alternate;
        }

        .sticker-right {
            right: max(3vw, 20px);
            top: 10%;
            width: clamp(130px, 17vw, 220px);
            animation: swayRight 5s ease-in-out infinite alternate;
        }

        .side-badge {
            margin-top: 10px;
            background: #fff;
            border: 2.5px solid var(--border-color);
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--text-main);
            box-shadow: 3px 3px 0px var(--shadow-color);
        }

        @keyframes swayLeft {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-14px) rotate(2deg); }
        }

        @keyframes swayRight {
            0% { transform: translateY(0px) rotate(4deg); }
            100% { transform: translateY(-16px) rotate(-2deg); }
        }

        @media (max-width: 860px) {
            .side-sticker {
                display: none;
            }
        }

        .container {
            background-color: var(--card-bg);
            border: 3.5px solid var(--border-color);
            border-radius: 22px;
            padding: 45px 35px 35px 35px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 10px 10px 0px var(--shadow-color);
            position: relative;
            z-index: 3;
            animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardAppear {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .window-header {
            position: absolute;
            top: 14px;
            left: 18px;
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
        }
        .dot.pink { background-color: var(--accent-pink); }
        .dot.purple { background-color: var(--accent-purple); }
        .dot.blue { background-color: var(--btn-blue); }

        .tag-pill {
            position: absolute;
            top: 10px;
            right: 18px;
            font-size: 0.75rem;
            font-weight: 900;
            background-color: #ffe6f2;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 2px 10px;
            color: var(--text-main);
        }

        h1 {
            font-size: 2.2rem;
            color: var(--border-color);
            margin-bottom: 4px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .hearts-bar {
            color: var(--accent-pink);
            font-size: 1.3rem;
            letter-spacing: 6px;
            margin-bottom: 18px;
            text-shadow: 1px 1px 0px var(--border-color);
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 600;
            color: var(--text-main);
        }

        .vcc-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--btn-blue);
            color: var(--border-color);
            padding: 16px 32px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.15rem;
            border: 3.5px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: all 0.12s ease-in-out;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
        }

        .vcc-button:hover {
            background-color: var(--btn-blue-hover);
            transform: translate(-3px, -3px);
            box-shadow: 7px 7px 0px var(--border-color);
        }

        .vcc-button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #9c6c80;
            font-weight: 700;
        }

        .footer span {
            color: var(--accent-pink);
        }
    </style>
</head>
<body>

    <div class="bg-decorations">
        <div class="floating-item h1">♡</div>
        <div class="floating-item h2">✧</div>
        <div class="floating-item h3">🐾</div>
        <div class="floating-item h4">♡</div>
        <div class="floating-item h5">✦</div>
        <div class="floating-item h6">♡</div>
        <div class="floating-item h7">✧</div>
        <div class="floating-item h8">🐾</div>
    </div>

    <div class="side-sticker sticker-left">
        <img src="https://api.iconify.design/twemoji:sparkling-heart.svg" alt="Astolfo Heart Decor" style="padding: 20px; background: #fff0f6;" />
        <div class="side-badge">✨ nyaa ~ ✨</div>
    </div>

    <div class="side-sticker sticker-right">
        <img src="https://api.iconify.design/fluent-emoji:cat-with-wry-smile.svg" alt="Catboy Decor" style="padding: 20px; background: #fbeeff;" />
        <div class="side-badge">💕 100% cute 💕</div>
    </div>

    <div class="container">
        <div class="window-header">
            <div class="dot pink"></div>
            <div class="dot purple"></div>
            <div class="dot blue"></div>
        </div>

        <div class="tag-pill">v1.0.0</div>

        <h1>Rainy's Tools</h1>
        <div class="hearts-bar">♡ ♡ ♡ ♡ ♡</div>
        
        <p>Welcome to my VPM repository! <br> Add this to VCC to get all my VRChat optimization tools, outfit linkers, and VRAM helpers. ( ˘ ³˘)♥</p>
        
        <a class="vcc-button" href="vcc://vpm/addRepo?url=https://URektMe.github.io/rainywithin-vpm/index.json">
            ✨ Add to VCC ✨
        </a>

        <div class="footer">
            made with <span>♡</span> by rainywithin
        </div>
    </div>

</body>
</html>
